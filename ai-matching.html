    .ai-note{max-width:1100px;margin:12px auto 72px;padding:0 24px;color:var(--muted);font-size:clamp(16px,1.6vw,26px);line-height:1.65}.ai-note strong{display:block;color:var(--paper);font-size:1.12em;margin-bottom:.35em}.ai-back{position:fixed;z-index:5;top:22px;left:22px;color:var(--paper);text-decoration:none;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:10px 15px;background:rgba(4,14,18,.72);backdrop-filter:blur(12px);font-size:13px}.ai-back:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
    @media (prefers-reduced-motion:reduce){.ai-asset{opacity:1;transform:none;transition:none}}
    @media (max-width:680px){.ai-back{top:12px;left:12px;font-size:11px;padding:8px 11px}.ai-long-canvas{min-width:0}.ai-note{margin:12px auto 48px;padding:0 16px;font-size:14px}}
