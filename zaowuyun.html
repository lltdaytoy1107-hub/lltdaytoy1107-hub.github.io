  <script>
    (() => {
      const stages = document.querySelectorAll('.optimization-stage');
      if (!('IntersectionObserver' in window)) { stages.forEach(stage => stage.classList.add('visible')); return; }
      const stageObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { entry.target.classList.add('visible'); stageObserver.unobserve(entry.target); }
        });
      }, { threshold: 0, rootMargin: `0px 0px -${Math.round(window.innerHeight * .4)}px 0px` });
      stages.forEach(stage => stageObserver.observe(stage));
    })();
  </script>

    (() => { const root=document.querySelector('.feedback-danmaku'); if(!root) return; const tracks=[...root.querySelectorAll('.feedback-track')]; const bubbles=[...root.querySelectorAll('.feedback-track-set img')].map(img=>{ const wrap=document.createElement('span'); wrap.className='feedback-bubble'; img.parentNode.insertBefore(wrap,img); wrap.append(img); return wrap; }); const pause=(selected)=>{ root.classList.add('feedback-has-selection'); tracks.forEach(track=>{ track.style.animationPlayState='paused'; }); bubbles.forEach(item=>{ const active=item===selected; item.classList.toggle('feedback-is-selected',active); item.style.opacity=active?'1':'.32'; item.style.filter=active?'none':'brightness(.72)'; item.style.transform=active?'scale(1.03)':''; }); }; const resume=()=>{ root.classList.remove('feedback-has-selection'); tracks.forEach(track=>{ track.style.animationPlayState='running'; }); bubbles.forEach(item=>{ item.classList.remove('feedback-is-selected'); item.style.opacity=''; item.style.filter=''; item.style.transform=''; }); }; root.addEventListener('mouseover',event=>{ const bubble=event.target.closest('.feedback-bubble'); if(bubble && root.contains(bubble)) pause(bubble); }); root.addEventListener('mouseout',event=>{ const from=event.target.closest('.feedback-bubble'); const to=event.relatedTarget && event.relatedTarget.closest ? event.relatedTarget.closest('.feedback-bubble') : null; if(from && from!==to) resume(); }); root.addEventListener('mouseleave',resume); })();
  </script>
