  <script>
    (() => {
      const viewport = document.querySelector('[data-koala-nav-viewport]');
      const nav = viewport.querySelector('nav');
      const links = [...nav.querySelectorAll('a')];
      const sections = links.map(link => document.querySelector(link.hash));
      let active = links.find(link => link.hash === location.hash) || links[0];
      let frame = 0;
      const sync = () => {
        // Focus can scroll an overflow:hidden container; the transform owns
        // positioning, so clear native scrolling before calculating offsets.
        viewport.scrollLeft = 0;
        nav.scrollLeft = 0;
        links.forEach(link => {
          link.setAttribute('aria-current', link === active ? 'location' : 'false');
          const scale = link === active ? 1.28 : link.matches(':hover, :focus-visible') ? 1.05 : 1;
          link.style.setProperty('--nav-space-right', `${link.offsetWidth * (scale - 1)}px`);
        });
        const maxShift = Math.max(0, nav.offsetWidth - viewport.clientWidth);
        const center = active.offsetLeft + active.offsetWidth * 1.28 / 2;
        const shift = maxShift <= 1 ? 0 : Math.max(-maxShift, Math.min(0, viewport.clientWidth / 2 - center));
        nav.style.setProperty('--nav-shift', `${shift}px`);
        const left = shift < -1;
        const right = shift > -maxShift + 1;
        const start = left ? 'transparent 0%, rgba(0,0,0,.5) 3%, #000 10%' : '#000 0%';
        const end = right ? '#000 90%, rgba(0,0,0,.5) 97%, transparent 100%' : '#000 100%';
        viewport.style.setProperty('--koala-nav-mask', maxShift <= 1 ? 'none' : `linear-gradient(90deg, ${start}, ${end})`);
        viewport.classList.toggle('has-left-overflow', left);
        viewport.classList.toggle('has-right-overflow', right);
      };
      const updateFromScroll = () => {
        frame = 0;
        document.body.classList.toggle('has-scrolled', scrollY > 8);
        const section = sections.filter(section => section.getBoundingClientRect().top <= Math.max(90, innerHeight * .25)).at(-1) || sections[0];
        active = links.find(link => link.hash === `#${section.id}`);
        sync();
      };
      const alignAnchor = () => {
        const link = links.find(link => link.hash === location.hash);
        if (link) {
          active = link;
          document.querySelector(link.hash).scrollIntoView({behavior:'instant', block:'start'});
        }
        sync();
      };
      links.forEach(link => link.addEventListener('click', () => { active = link; sync(); }));
      window.addEventListener('hashchange', alignAnchor);
      window.addEventListener('load', alignAnchor, {once:true});
      window.addEventListener('scroll', () => { if (!frame) frame = requestAnimationFrame(updateFromScroll); }, {passive:true});
      window.addEventListener('resize', sync, {passive:true});
      nav.addEventListener('pointermove', sync, {passive:true});
      nav.addEventListener('pointerleave', sync, {passive:true});
      nav.addEventListener('focusin', sync);
      nav.addEventListener('focusout', () => requestAnimationFrame(sync));
      sync();
    })();
  </script>
